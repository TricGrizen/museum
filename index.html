<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>museum</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="museum">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css?v=202608050059">
</head>
<body>

<section class="screen unlock" id="scrUnlock" hidden>
  <div class="unlock-box">
    <img class="unlock-icon" src="icons/icon-192.png" alt="" width="84" height="84" draggable="false">
    <div class="unlock-name">museum</div>
    <form class="unlock-form" id="pinForm" autocomplete="off" novalidate>
      <input class="pin" id="pin" type="text" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" aria-label="PIN">
    </form>
    <div class="dots" id="dots"><i></i><i></i><i></i></div>
  </div>
</section>

<section class="screen shelf" id="scrShelf" hidden>
  <div id="books"></div>
  <div id="hits" hidden></div>
</section>

<section class="screen topic" id="scrTopic" hidden>
  <button class="backrow" id="topicBack" type="button" aria-label="Back">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div id="topicList"></div>
</section>

<section class="screen memo" id="scrMemo" hidden>
  <button class="backrow" id="memoBack" type="button" aria-label="Back">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="memo-doc" id="memoDoc"></div>
</section>

<section class="screen reader" id="scrRead" hidden>
  <article class="doc" id="doc"></article>
</section>

<div class="editbar" id="memoBar" hidden>
  <button class="bar-btn" id="btnClock" type="button" aria-label="Timestamps">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 7.2V12l3.2 2" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="bar-btn" id="btnMemoNew" type="button" aria-label="New">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 12.8V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V5.5A1.5 1.5 0 0 1 5.5 4H12"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17.6 3.4 20.6 6.4 14 13H11V10z" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="searchbar" id="searchBar" hidden>
  <div class="search" id="searchPill">
    <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M15.8 15.8 20.5 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input class="search-in" id="searchInput" type="text" placeholder="搜索"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           enterkeyhint="search" aria-label="Search">
    <button class="search-x" id="searchClear" type="button" hidden aria-label="Clear">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 9l6 6M15 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="chrome" id="chrome" hidden>
  <div class="topbar" id="topbar">
    <button class="tb-btn" id="btnBack" type="button" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tb-btn" id="btnToc" type="button" aria-label="Contents">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 6.5h16M4 12h16M4 17.5h16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="bottombar" id="bottombar">
    <div class="bb-fonts">
      <button class="bb-font bb-font-sm" id="btnFontDown" type="button" aria-label="Smaller">A</button>
      <button class="bb-font bb-font-lg" id="btnFontUp" type="button" aria-label="Larger">A</button>
    </div>
    <button class="bb-note" id="btnNote" type="button" aria-label="Notes">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12.8V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V5.5A1.5 1.5 0 0 1 5.5 4H12"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.6 3.4 20.6 6.4 14 13H11V10z" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="bb-pct" id="pctLabel">0%</span>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet"><nav class="sheet-list" id="sheetList"></nav></div>
</div>

<div class="sheet-wrap" id="noteWrap" hidden>
  <div class="sheet-backdrop" id="noteBackdrop"></div>
  <div class="sheet sheet-note">
    <div class="note-list" id="noteList"></div>
    <div class="editbar editbar-flat" id="noteBar">
      <button class="bar-btn" id="btnNoteNew" type="button" aria-label="New">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12.8V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V5.5A1.5 1.5 0 0 1 5.5 4H12"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17.6 3.4 20.6 6.4 14 13H11V10z" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="editor" id="editor" hidden>
  <div class="ed-top">
    <button class="tb-btn" id="edBack" type="button" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tb-btn ed-del" id="edDel" type="button" aria-label="Delete">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.5 6.5h15M9.5 6.5V4.6A1.1 1.1 0 0 1 10.6 3.5h2.8a1.1 1.1 0 0 1 1.1 1.1V6.5M6.7 6.5l.9 12.4A1.6 1.6 0 0 0 9.2 20.5h5.6a1.6 1.6 0 0 0 1.6-1.6l.9-12.4"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <textarea class="ed-area" id="edArea" spellcheck="false" autocorrect="off" autocapitalize="sentences"
            aria-label="Editor"></textarea>
</div>

<div class="cap" id="cap" hidden>
  <button class="cap-dot hl-y" type="button" data-c="y" aria-label="Y"></button>
  <button class="cap-dot hl-g" type="button" data-c="g" aria-label="G"></button>
  <button class="cap-dot hl-b" type="button" data-c="b" aria-label="B"></button>
  <button class="cap-dot hl-p" type="button" data-c="p" aria-label="P"></button>
  <button class="cap-dot hl-v" type="button" data-c="v" aria-label="V"></button>
  <button class="cap-del" id="capDel" type="button" hidden aria-label="Remove">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M6.2 17.8 17.8 6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<script src="marked.min.js?v=202608050059"></script>
<script src="app.js?v=202608050059"></script>
</body>
</html>
